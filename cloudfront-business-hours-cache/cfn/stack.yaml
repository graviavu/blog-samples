AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Business-hours cache sample. A Lambda@Edge origin-response function sets Cache-Control from a window kept in S3:
  no cache inside the window, long cache outside (capped to the time until the window opens). Test origin = Lambda function URL.
  MUST be deployed in us-east-1 (Lambda@Edge functions can only be created there).
  WARNING: the test origin sits behind a PUBLIC Lambda function URL (AuthType NONE) with no cap on invocations unless you set
  OriginReservedConcurrency. Anyone who finds the URL can invoke it. For a throwaway test account only; for real use put the
  origin behind CloudFront origin access control with AuthType AWS_IAM.

# Deploy by hand (without run-test.sh), see README "Use the template by itself":
#   1. zip edge/index.py (with __CONFIG_BUCKET__ and __CONFIG_KEY__ replaced, index.py at the root of the zip) and put it in an S3 bucket in us-east-1
#   2. aws cloudformation create-stack --region us-east-1 --stack-name bhc-<RunId> --template-body file://cfn/stack.yaml
#        --capabilities CAPABILITY_NAMED_IAM --parameters ParameterKey=RunId,ParameterValue=<RunId> ...
#   3. upload your window JSON to s3://<ConfigBucketName>/<ConfigKey>

Parameters:
  RunId:
    Type: String
    Description: Short id used in every resource name and as the RunId tag, for example 2610101200-ab12.
    AllowedPattern: '[0-9]{10}-[0-9a-f]{4}'
    ConstraintDescription: ten digits, a dash, four lowercase hex characters
  ConfigBucketName:
    Type: String
    Description: Name of the (new) bucket that holds the window JSON. The edge code has this name baked in, so it is a parameter.
    AllowedPattern: '[a-z0-9][a-z0-9-]{1,61}[a-z0-9]'
  ConfigKey:
    Type: String
    Default: window.json
    Description: Object key of the window JSON. Also baked into the edge code.
    AllowedPattern: '[A-Za-z0-9._-]{1,128}'
    ConstraintDescription: letters, digits, dot, underscore and dash only
  CodeBucket:
    Type: String
    Description: Existing bucket in us-east-1 that holds the zip of the edge function.
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  CodeKey:
    Type: String
    Default: edge.zip
    Description: Object key of the edge function zip.
    AllowedPattern: '[A-Za-z0-9._/-]{1,256}'
  EdgeRuntime:
    Type: String
    Default: python3.12
    AllowedPattern: 'python3\.[0-9]+'
    Description: >-
      Python runtime of the Lambda@Edge function (edge/index.py, uses boto3 which the Python runtime includes). Lambda@Edge
      supports the current Python runtimes; check the exact version against the Lambda runtimes page and use the newest it accepts.
  OriginRuntime:
    Type: String
    Default: nodejs22.x
    AllowedPattern: 'nodejs[0-9]+\.x'
    Description: Runtime of the test origin function (inline CommonJS code).
  PermissionsBoundary:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:iam::[0-9]{12}:policy/[\w+=,./@-]+$'
    Description: >-
      Optional ARN of an IAM permissions boundary policy for the two roles this stack creates (see README, "Running it as a
      person with limited rights"). Empty = none.
  OriginReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Reserved concurrency for the public test origin (0 = none). A cap on what a stranger who finds the URL can run up.
      Many new accounts cannot reserve (the unreserved pool must keep 100), which is why the default is 0.

Conditions:
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundary, '']]
  ReserveOriginConcurrency: !Not [!Equals [!Ref OriginReservedConcurrency, 0]]

Resources:

  # ---- Config bucket: holds the window JSON. Private, encrypted, and one bucket policy statement: deny non-TLS requests.
  ConfigBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ConfigBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - {Key: RunId, Value: !Ref RunId}
        - {Key: Purpose, Value: bhc-test}

  # Only one statement: refuse plain HTTP. (Keep this bucket free of other policies.)
  ConfigBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConfigBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ConfigBucket.Arn
              - !Sub '${ConfigBucket.Arn}/*'
            Condition:
              Bool: {'aws:SecureTransport': 'false'}

  # ---- Roles. The edge role may read ONE object (and list the bucket so that a missing key reads as NoSuchKey) and
  #      write logs of its own log groups. The origin role writes logs only.
  EdgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bhc-${RunId}-erole'
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundary, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com, edgelambda.amazonaws.com]   # Lambda@Edge needs both
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bhc-inline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ConfigBucketName}/${ConfigKey}'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ConfigBucketName}'
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  # the edge function logs as /aws/lambda/us-east-1.<function> in the region of the edge location
                  - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/us-east-1.bhc-${RunId}-edge'
                  - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/us-east-1.bhc-${RunId}-edge:*'
      Tags:
        - {Key: RunId, Value: !Ref RunId}
        - {Key: Purpose, Value: bhc-test}

  OriginRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bhc-${RunId}-orole'
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundary, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bhc-inline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/bhc-${RunId}-origin'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/bhc-${RunId}-origin:*'
      Tags:
        - {Key: RunId, Value: !Ref RunId}
        - {Key: Purpose, Value: bhc-test}

  # ---- Test origin: returns {now, counter, nonce, path}, no Cache-Control, 500 on /err*.
  #      Code is inline (it is tiny); it is a copy of origin/index.js (tests/run.sh checks they are identical).
  OriginFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'bhc-${RunId}-origin'
      Runtime: !Ref OriginRuntime
      Handler: index.handler
      Role: !GetAtt OriginRole.Arn
      Timeout: 5
      ReservedConcurrentExecutions: !If [ReserveOriginConcurrency, !Ref OriginReservedConcurrency, !Ref 'AWS::NoValue']
      Tags:
        - {Key: RunId, Value: !Ref RunId}
        - {Key: Purpose, Value: bhc-test}
      Code:
        ZipFile: |
          // Test origin (Lambda function URL). Returns {now, counter, nonce, path} and NO Cache-Control header,
          // so the Lambda@Edge function alone decides. A repeated nonce means CloudFront answered from its cache.
          // The counter counts invocations of this execution environment. A path starting with /err answers 500.
          // CommonJS on purpose: this file is pasted inline into cfn/stack.yaml (inline code is saved as index.js).
          let counter = 0;
          const instance = Math.random().toString(36).slice(2, 8);
          exports.handler = async (event) => {
            counter += 1;
            const path = (event && event.rawPath) || '/';
            const nonce = `${instance}-${counter}-${Math.random().toString(36).slice(2, 8)}`;
            const body = JSON.stringify({ now: new Date().toISOString(), counter, nonce, path });
            return {
              statusCode: path.startsWith('/err') ? 500 : 200,
              headers: { 'content-type': 'application/json' },
              body,
            };
          };

  # PUBLIC function URL: for this test only. For real use put it behind CloudFront origin access control with AuthType AWS_IAM.
  OriginUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt OriginFunction.Arn
      AuthType: NONE

  OriginUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OriginFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  OriginInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OriginFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  # ---- The Lambda@Edge function (edge/index.py, zipped with the bucket and key baked in) and the published version
  #      that CloudFront needs. The code is too big for inline ZipFile (4096 characters), so it is a zip in S3.
  EdgeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'bhc-${RunId}-edge'
      Runtime: !Ref EdgeRuntime
      Handler: index.lambda_handler
      Role: !GetAtt EdgeRole.Arn
      Timeout: 10      # a cold boto3 import plus the S3 call (1.5 s connect and read timeouts); the limit for origin events is 30 s
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Tags:
        - {Key: RunId, Value: !Ref RunId}
        - {Key: Purpose, Value: bhc-test}

  # Lambda@Edge replicas are removed by AWS some hours after the distribution is gone, so deleting the function and this
  # version can fail with DELETE_FAILED. run-test.sh handles that (retain these resources, delete them later with --cleanup).
  EdgeVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref EdgeFunction

  # ---- Cache policy: min 0, default 0, max 86400; nothing but the path in the cache key.
  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub 'bhc-${RunId}-cp'
        Comment: !Sub 'bhc test ${RunId}'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 86400            # rules in the window JSON must not use a TTL above this
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig: {HeaderBehavior: none}
          CookiesConfig: {CookieBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}

  # ---- Distribution: origin = the function URL, the edge function on origin-response.
  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: [OriginUrlPermission, OriginInvokePermission]   # the URL must be callable before CloudFront can use it
    Properties:
      Tags:
        - {Key: RunId, Value: !Ref RunId}
        - {Key: Purpose, Value: bhc-test}
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'bhc test ${RunId}'
        PriceClass: PriceClass_100
        Origins:
          - Id: origin
            DomainName: !Select [2, !Split ['/', !GetAtt OriginUrl.FunctionUrl]]   # https://<id>.lambda-url.<region>.on.aws/
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: origin
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: false
          CachePolicyId: !Ref CachePolicy
          LambdaFunctionAssociations:
            - EventType: origin-response
              LambdaFunctionARN: !Ref EdgeVersion    # Ref of a Version is its ARN including the version number
        # No CustomErrorResponses: CloudFront caches a 5xx from the origin for its default of 10 seconds (or the origin's own
        # max-age/s-maxage if that is longer; the edge function never rewrites statuses >= 400). T-D relies on exactly that.

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  OriginHost:
    Value: !Select [2, !Split ['/', !GetAtt OriginUrl.FunctionUrl]]
  ConfigBucket:
    Value: !Ref ConfigBucket
