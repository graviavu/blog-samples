AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Sample for the folder-URL 403 post. One private S3 bucket (REST origin, OAC, block public access on) behind two CloudFront
  distributions: "plain" (no function, no error response) and "fixed" (index rewrite function plus 403 to /404.html with a
  60 s error-caching TTL). Created and deleted by run-test.sh. Test only.

Parameters:
  RunId:
    Type: String
    AllowedPattern: "^[0-9]{10}-[0-9a-f]{4}$"
    Description: Unique run id; part of every resource name and tag.
  NewHost:
    Type: String
    Default: www.example.invalid
    Description: Host used by the function for its no-slash redirect. Never resolved by the test.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "cfi-${RunId}-site"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: RunId
          Value: !Ref RunId
        - Key: Purpose
          Value: sample

  # Only s3:GetObject is granted, never s3:ListBucket. That is why a missing key answers 403 and not 404.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn":
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${PlainDistribution}"
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FixedDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "cfi-${RunId}-oac"
        Description: Signs every request from CloudFront to the private bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The post's RewriteFunction (site/infra/aws.yaml), with the old domain switched off (empty Old).
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "cfi-${RunId}-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Directory index rewrite (sample)
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          // Percent-encode one query key or value for the Location header. Kept as is: A-Z a-z 0-9 - . _ ~ and '+'
          // (form-encoded space), and valid %XX escapes, so nothing is encoded twice whether the runtime passes raw or
          // decoded values. Everything else (& = # % ' " < > spaces, controls, non-ASCII as UTF-8) is percent-encoded.
          function enc(t) {
            return String(t).replace(/%[0-9A-Fa-f]{2}|[^A-Za-z0-9\-._~+%]+|%/g, function (m) {
              if (m.charAt(0) === '%') { return m.length === 3 ? m : '%25'; }
              return encodeURIComponent(m).replace(/[!'()*]/g, function (c) {
                return '%' + c.charCodeAt(0).toString(16).toUpperCase();
              });
            });
          }
          // Rebuild "?a=b&c" from the parsed query string (redirects must keep it).
          function qs(q) {
            var parts = [];
            try {
              for (var k in q) {
                var e = q[k];
                var vals = e.multiValue ? e.multiValue.map(function (m) { return m.value; }) : [e.value];
                for (var i = 0; i < vals.length; i++) {
                  parts.push(vals[i] === '' ? enc(k) : enc(k) + '=' + enc(vals[i]));
                }
              }
            } catch (err) {
              return '';  // a value encodeURIComponent cannot encode: redirect without the query rather than fail
            }
            return parts.length ? '?' + parts.join('&') : '';
          }
          function moved(location) {
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: location } } };
          }
          function handler(event) {
            var req = event.request;
            var host = (req.headers.host && req.headers.host.value) || '';
            var oldHost = '${Old}';
            var newHost = '${DomainName}';
            var uri = req.uri;
            var isDir = uri.charAt(uri.length - 1) === '/';
            var noExt = uri.substring(uri.lastIndexOf('/') + 1).indexOf('.') === -1;
            if (oldHost !== '' && host === oldHost) {
              // One redirect for /posts/x?q too: add the directory slash here instead of a second 301 on the new host.
              return moved('https://' + newHost + uri + (!isDir && noExt ? '/' : '') + qs(req.querystring));
            }
            if (isDir) {
              req.uri = uri + 'index.html';
            } else if (noExt) {
              return moved('https://' + newHost + uri + '/' + qs(req.querystring));
            }
            return req;
          }
        - Old: ""
          DomainName: !Ref NewHost

  # Distribution 1: nothing fixes the folder URL. Default error caching, no custom error response.
  PlainDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: RunId
          Value: !Ref RunId
        - Key: Purpose
          Value: sample
      DistributionConfig:
        Enabled: true
        Comment: !Sub "cfi-${RunId} plain (sample)"
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: https-only
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # managed CachingOptimized

  # Distribution 2: the post's fix. Rewrite function on viewer-request, 403 mapped to /404.html (status 404), error cached 60 s.
  FixedDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: RunId
          Value: !Ref RunId
        - Key: Purpose
          Value: sample
      DistributionConfig:
        Enabled: true
        Comment: !Sub "cfi-${RunId} fixed (sample)"
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: https-only
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # managed CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  PlainDomain:
    Value: !GetAtt PlainDistribution.DomainName
  FixedDomain:
    Value: !GetAtt FixedDistribution.DomainName
